services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: document-rag-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    environment:
      - CHROMA_DB_PATH=/data/chroma
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://jaeger:4318/v1/traces
    depends_on:
      - chroma
      - jaeger
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: document-rag-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000

  chroma:
    image: chromadb/chroma:latest
    container_name: document-rag-chroma
    volumes:
      - chroma_data:/data
    ports:
      - "8001:8000"

  jaeger:
    image: jaegertracing/jaeger:latest
    container_name: document-rag-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "4318:4318"
      - "16686:16686"

volumes:
  chroma_data:
