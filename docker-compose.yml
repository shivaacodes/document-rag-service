services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: document-rag-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    environment:
      - CHROMA_SERVER_HOST=chroma
      - CHROMA_SERVER_HTTP_PORT=8000
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://jaeger:4318/v1/traces
    depends_on:
      - chroma
      - jaeger
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: dev
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: document-rag-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules
      - /frontend/.next
    command: npm run dev
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000

  chroma:
    image: chromadb/chroma:latest
    container_name: document-rag-chroma
    volumes:
      - chroma_data:/data
    ports:
      - "8001:8000"

  jaeger:
    image: jaegertracing/jaeger:latest
    container_name: document-rag-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "4318:4318"
      - "16686:16686"

  prometheus:
    image: prom/prometheus:latest
    container_name: document-rag-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: document-rag-grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  chroma_data:
